server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # ── Hashed build assets (Vite fingerprints filenames) — cache aggressively ─
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── SPA history fallback: unknown paths serve the app shell ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Never cache the entry HTML so new deploys are picked up immediately ────
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
